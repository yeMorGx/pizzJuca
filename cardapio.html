<!DOCTYPE html>
<!--
  O QUE É ESTA PÁGINA? (bem simples)
  ─────────────────────────────────
  Isto é o "site" que o cliente vê no browser: HTML desenha o ecrã, CSS pinta e
  alinha, JavaScript (lá em baixo no ficheiro) chama a API em api/pizza/getall.php
  e api/bebidas/getall.php para ir buscar os dados reais ao MySQL e mostrar no ecrã.
  Não há PHP aqui dentro — o servidor só entrega este ficheiro estático e o teu
  browser é que fala com a API.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PizzJuca | Pedido</title>
  <style>
    /* Tokens no espírito Radix Themes / neutros (escala tipo gray/slate) */
    :root {
      --gray-1: #fcfcfd;
      --gray-2: #f9f9fb;
      --gray-3: #f0f0f3;
      --gray-4: #e8e8ec;
      --gray-5: #e0e1e6;
      --gray-6: #d9d9e0;
      --gray-9: #8b8d98;
      --gray-11: #60646c;
      --gray-12: #1c2024;
      --accent: #111113;
      --accent-hover: #000;
      --ring: rgba(28, 32, 36, 0.35);
      --shadow-1: 0 1px 2px rgba(28, 32, 36, 0.04);
      --shadow-2: 0 4px 16px rgba(28, 32, 36, 0.06);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-fast: 140ms;
      --dur-med: 220ms;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--gray-12);
      background: var(--gray-2);
      -webkit-font-smoothing: antialiased;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-in-soft {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes cart-row-in {
      from { opacity: 0; transform: translateX(-6px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 20px 48px;
      display: grid;
      gap: 24px;
      animation: fade-in-soft var(--dur-med) var(--ease-out) both;
    }

    .hero {
      background: var(--gray-1);
      border: 1px solid var(--gray-5);
      border-radius: var(--radius-lg);
      padding: 22px 22px 20px;
      box-shadow: var(--shadow-1);
      animation: fade-in var(--dur-med) var(--ease-out) both;
    }

    .hero h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--gray-12);
    }

    .hero p {
      margin: 0;
      color: var(--gray-11);
      font-size: 0.95rem;
      max-width: 52ch;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .catalog {
      display: grid;
      gap: 20px;
    }

    .section-card {
      background: var(--gray-1);
      border: 1px solid var(--gray-5);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-1);
      animation: fade-in var(--dur-med) var(--ease-out) both;
      animation-delay: 40ms;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gray-11);
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }

    .item {
      display: grid;
      grid-template-columns: 96px 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--gray-5);
      border-radius: var(--radius-md);
      padding: 10px;
      background: var(--gray-1);
      box-shadow: var(--shadow-1);
      transition:
        border-color var(--dur-fast) ease,
        box-shadow var(--dur-fast) ease,
        transform var(--dur-fast) var(--ease-out);
      opacity: 0;
      animation: fade-in var(--dur-med) var(--ease-out) forwards;
    }

    .item:hover {
      border-color: var(--gray-6);
      box-shadow: var(--shadow-2);
      transform: translateY(-1px);
    }

    .thumb-wrap {
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--gray-4);
      background: var(--gray-3);
      line-height: 0;
    }

    .thumb {
      width: 96px;
      height: 96px;
      object-fit: cover;
      display: block;
      transition: transform var(--dur-med) var(--ease-out);
    }

    .item:hover .thumb {
      transform: scale(1.04);
    }

    .item h3 {
      margin: 0 0 4px;
      font-size: 0.98rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--gray-12);
    }

    .desc {
      margin: 0;
      color: var(--gray-11);
      font-size: 0.8125rem;
      line-height: 1.4;
    }

    .price {
      margin-top: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--gray-12);
      font-variant-numeric: tabular-nums;
    }

    .add-btn {
      border: 1px solid var(--gray-6);
      background: var(--gray-1);
      color: var(--gray-12);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-weight: 500;
      font-size: 0.8125rem;
      cursor: pointer;
      min-width: 88px;
      transition:
        background var(--dur-fast) ease,
        border-color var(--dur-fast) ease,
        color var(--dur-fast) ease,
        transform var(--dur-fast) var(--ease-out),
        box-shadow var(--dur-fast) ease;
    }

    .add-btn:hover {
      background: var(--gray-2);
      border-color: var(--gray-9);
    }

    .add-btn:active {
      transform: scale(0.97);
    }

    .add-btn:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    .cart {
      background: var(--gray-1);
      border: 1px solid var(--gray-5);
      border-radius: var(--radius-lg);
      padding: 18px;
      align-self: start;
      position: sticky;
      top: 16px;
      box-shadow: var(--shadow-1);
      animation: fade-in var(--dur-med) var(--ease-out) both;
      animation-delay: 80ms;
    }

    .cart h2 {
      margin: 0 0 12px;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--gray-12);
    }

    .cart-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
      max-height: 340px;
      overflow: auto;
    }

    .cart-item {
      border: 1px solid var(--gray-5);
      border-radius: var(--radius-md);
      padding: 10px;
      display: grid;
      gap: 8px;
      background: var(--gray-2);
      animation: cart-row-in var(--dur-med) var(--ease-out) both;
    }

    .cart-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .cart-line strong {
      font-weight: 500;
      font-size: 0.875rem;
    }

    .cart-line span {
      font-variant-numeric: tabular-nums;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .cart-line small {
      color: var(--gray-11);
      font-size: 0.75rem;
    }

    .qty {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: 1px solid var(--gray-5);
      border-radius: var(--radius-sm);
      padding: 2px;
      background: var(--gray-1);
    }

    .qty button {
      border: none;
      background: transparent;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--gray-12);
      transition: background var(--dur-fast) ease;
    }

    .qty button:hover {
      background: var(--gray-3);
    }

    .qty button:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 0;
    }

    .qty span {
      min-width: 1.5rem;
      text-align: center;
      font-size: 0.8125rem;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .cart-empty {
      color: var(--gray-11);
      font-size: 0.875rem;
      margin: 0 0 4px;
    }

    .totals {
      margin-top: 14px;
      border-top: 1px solid var(--gray-5);
      padding-top: 12px;
      display: grid;
      gap: 8px;
      font-size: 0.875rem;
    }

    .totals .line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: var(--gray-11);
    }

    .totals .line strong {
      color: var(--gray-12);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .totals .final {
      font-weight: 600;
      color: var(--gray-12);
      font-size: 0.9375rem;
      padding-top: 4px;
    }

    .totals .final strong {
      font-weight: 600;
      display: inline-block;
      transition: transform var(--dur-fast) var(--ease-out);
    }

    @keyframes total-bump {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(1.06); }
    }

    .totals.is-updated .final strong {
      animation: total-bump 0.38s var(--ease-out);
    }

    .checkout {
      margin-top: 14px;
      width: 100%;
      border: 1px solid transparent;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition:
        background var(--dur-fast) ease,
        transform var(--dur-fast) var(--ease-out),
        opacity var(--dur-fast) ease;
    }

    .checkout:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .checkout:active:not(:disabled) {
      transform: scale(0.99);
    }

    .checkout:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    .checkout:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .top-actions {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--gray-4);
      font-size: 0.8125rem;
    }

    .top-actions a {
      color: var(--gray-12);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid var(--gray-9);
      transition: border-color var(--dur-fast) ease, color var(--dur-fast) ease;
    }

    .top-actions a:hover {
      color: var(--accent-hover);
      border-color: var(--gray-12);
    }

    .top-actions a:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 3px;
      border-radius: 2px;
    }

    .erro {
      background: var(--gray-2);
      color: var(--gray-12);
      border: 1px solid var(--gray-6);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 0.875rem;
    }

    @media (min-width: 960px) {
      .layout {
        grid-template-columns: 1fr 340px;
        align-items: start;
      }
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>PizzJuca</h1>
      <p>Monte seu pedido no estilo app de delivery: escolha itens, ajuste quantidades e finalize.</p>
      <div class="top-actions"><a href="crud.html">Ir para área administrativa (CRUD)</a></div>
    </section>

    <div class="layout">
      <section class="catalog">
        <div class="section-card">
          <h2 class="section-title">Pizzas</h2>
          <div id="pizzas-grid" class="grid"></div>
        </div>
        <div class="section-card">
          <h2 class="section-title">Bebidas</h2>
          <div id="bebidas-grid" class="grid"></div>
        </div>
      </section>

      <aside class="cart">
        <h2>Seu pedido</h2>
        <ul id="cart-list" class="cart-list"></ul>
        <p id="cart-empty" class="cart-empty">Seu carrinho está vazio.</p>
        <div id="totals-box" class="totals">
          <div class="line"><span>Subtotal</span><strong id="subtotal">R$ 0,00</strong></div>
          <div class="line"><span>Taxa de entrega</span><strong id="taxa">R$ 0,00</strong></div>
          <div class="line final"><span>Total</span><strong id="total">R$ 0,00</strong></div>
        </div>
        <button id="checkout" class="checkout" disabled>Finalizar pedido</button>
      </aside>
    </div>
  </main>

  <script>
    const DELIVERY_FEE = 5;
    const cart = [];

    const imgPizzaFallback = "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=320&q=60";
    const imgBebidaFallback = "https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=320&q=60";

    const pizzaGrid = document.getElementById("pizzas-grid");
    const bebidaGrid = document.getElementById("bebidas-grid");
    const cartList = document.getElementById("cart-list");
    const cartEmpty = document.getElementById("cart-empty");
    const subtotalEl = document.getElementById("subtotal");
    const taxaEl = document.getElementById("taxa");
    const totalEl = document.getElementById("total");
    const checkoutBtn = document.getElementById("checkout");
    const totalsBox = document.getElementById("totals-box");

    function formatBRL(n) {
      return Number(n).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getPizzaImage(nome) {
      const n = String(nome || "").toLowerCase();
      if (n.includes("calabresa")) return "https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?auto=format&fit=crop&w=320&q=60";
      if (n.includes("frango")) return "https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?auto=format&fit=crop&w=320&q=60";
      if (n.includes("mussarela") || n.includes("muçarela")) return "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=320&q=60";
      return imgPizzaFallback;
    }

    function getBebidaImage(nome) {
      const n = String(nome || "").toLowerCase();
      if (n.includes("coca")) return "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=320&q=60";
      if (n.includes("suco")) return "https://images.unsplash.com/photo-1600271886742-f049cd5bba3f?auto=format&fit=crop&w=320&q=60";
      if (n.includes("agua") || n.includes("água")) return "https://images.unsplash.com/photo-1564419320461-6870880221ad?auto=format&fit=crop&w=320&q=60";
      return imgBebidaFallback;
    }

    async function carregarJson(url) {
      const r = await fetch(url);
      const text = await r.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch {
        throw new Error("Resposta inválida da API");
      }
      if (!r.ok) throw new Error(data.message || data.Mensagem || ("Erro " + r.status));
      return data;
    }

    function createItemCard(item, tipo, index) {
      const nome = esc(item.nome);
      const valor = Number(item.valor);
      const desc = tipo === "pizza"
        ? esc(item.ingredientes || "Sem ingredientes informados")
        : esc((item.litros || "?") + " L");
      const img = tipo === "pizza" ? getPizzaImage(item.nome) : getBebidaImage(item.nome);

      const div = document.createElement("article");
      div.className = "item";
      div.style.animationDelay = `${Math.min(index, 12) * 50}ms`;
      div.innerHTML = `
        <div class="thumb-wrap">
          <img class="thumb" src="${esc(img)}" alt="${tipo === "pizza" ? "Pizza" : "Bebida"} ${nome}" loading="lazy">
        </div>
        <div>
          <h3>${nome}</h3>
          <p class="desc">${desc}</p>
          <div class="price">${formatBRL(valor)}</div>
        </div>
        <button class="add-btn" type="button">Adicionar</button>
      `;
      div.querySelector("button").addEventListener("click", () => {
        addToCart({
          key: tipo + "-" + item.id,
          id: item.id,
          tipo,
          nome: item.nome,
          valor: valor
        });
      });
      return div;
    }

    function renderCatalog(target, items, tipo) {
      target.innerHTML = "";
      if (!Array.isArray(items) || items.length === 0) {
        target.innerHTML = '<div class="erro">Nenhum item disponível no momento.</div>';
        return;
      }
      items.forEach((item, i) => target.appendChild(createItemCard(item, tipo, i)));
    }

    function bumpTotals() {
      if (!totalsBox) return;
      totalsBox.classList.remove("is-updated");
      void totalsBox.offsetWidth;
      totalsBox.classList.add("is-updated");
      window.clearTimeout(bumpTotals._t);
      bumpTotals._t = window.setTimeout(() => totalsBox.classList.remove("is-updated"), 420);
    }

    function addToCart(newItem) {
      const exists = cart.find((c) => c.key === newItem.key);
      if (exists) {
        exists.qtd += 1;
      } else {
        cart.push({ ...newItem, qtd: 1 });
      }
      renderCart(true);
    }

    function changeQty(key, delta) {
      const item = cart.find((c) => c.key === key);
      if (!item) return;
      item.qtd += delta;
      if (item.qtd <= 0) {
        const idx = cart.findIndex((c) => c.key === key);
        cart.splice(idx, 1);
      }
      renderCart(true);
    }

    function renderCart(animateTotals) {
      cartList.innerHTML = "";
      cartEmpty.style.display = cart.length ? "none" : "block";

      cart.forEach((item, i) => {
        const li = document.createElement("li");
        li.className = "cart-item";
        li.style.animationDelay = `${Math.min(i, 10) * 40}ms`;
        li.innerHTML = `
          <div class="cart-line">
            <strong>${esc(item.nome)}</strong>
            <span>${formatBRL(item.valor * item.qtd)}</span>
          </div>
          <div class="cart-line">
            <small>${item.tipo === "pizza" ? "Pizza" : "Bebida"} • ${formatBRL(item.valor)} un.</small>
            <div class="qty">
              <button type="button" aria-label="Diminuir">-</button>
              <span>${item.qtd}</span>
              <button type="button" aria-label="Aumentar">+</button>
            </div>
          </div>
        `;
        const buttons = li.querySelectorAll("button");
        buttons[0].addEventListener("click", () => changeQty(item.key, -1));
        buttons[1].addEventListener("click", () => changeQty(item.key, 1));
        cartList.appendChild(li);
      });

      const subtotal = cart.reduce((acc, item) => acc + item.valor * item.qtd, 0);
      const total = subtotal + (cart.length ? DELIVERY_FEE : 0);
      subtotalEl.textContent = formatBRL(subtotal);
      taxaEl.textContent = formatBRL(cart.length ? DELIVERY_FEE : 0);
      totalEl.textContent = formatBRL(total);
      checkoutBtn.disabled = cart.length === 0;
      if (animateTotals && cart.length) bumpTotals();
    }

    checkoutBtn.addEventListener("click", () => {
      const subtotal = cart.reduce((acc, item) => acc + item.valor * item.qtd, 0);
      const total = subtotal + DELIVERY_FEE;
      const linhas = cart.map((i) => `- ${i.qtd}x ${i.nome} (${formatBRL(i.valor * i.qtd)})`).join("%0A");
      const texto = `Pedido PizzJuca:%0A${linhas}%0A%0ATotal: ${formatBRL(total)}`;
      const link = `https://wa.me/?text=${texto}`;
      window.open(link, "_blank");
    });

    async function init() {
      try {
        const [pizzas, bebidas] = await Promise.all([
          carregarJson("api/pizza/getall.php"),
          carregarJson("api/bebidas/getall.php")
        ]);
        renderCatalog(pizzaGrid, pizzas, "pizza");
        renderCatalog(bebidaGrid, bebidas, "bebida");
      } catch (e) {
        pizzaGrid.innerHTML = `<div class="erro">${esc(e.message)}</div>`;
        bebidaGrid.innerHTML = `<div class="erro">${esc(e.message)}</div>`;
      }
      renderCart(false);
    }

    init();
  </script>
</body>
</html>
